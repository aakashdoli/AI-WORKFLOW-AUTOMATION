version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    depends_on:
      - redis
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://api:8000
    env_file: .env
    depends_on:
      - api
    command: streamlit run app/dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

  worker:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    depends_on:
      - redis
    command: celery -A app.tasks worker --loglevel=info

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  sqlite_data:
